[project]
name = "repo2nb"
version = "0.3.0"
description = "Convert a local code repository into a Kaggle-ready Jupyter notebook"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "kaggle>=2.2.5",
    "nbformat",
    "pathspec>=0.10",
    # shortcut: Kaggle 2.2.5 omits six; remove after requiring a fixed release.
    "six",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
repo2nb = "repo2nb.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.10",
]
